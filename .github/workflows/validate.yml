name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Structure and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  opencode-discovery:
    # Informational: checks that a pinned OpenCode release discovers the assets.
    # Non-blocking because it depends on an external npm package.
    name: OpenCode discovery (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install OpenCode (pinned, local to the job)
        run: npm install --prefix "$RUNNER_TEMP/oc" opencode-ai@1.18.35
      - name: Check discovery
        run: python scripts/check_opencode_discovery.py --opencode "$RUNNER_TEMP/oc/node_modules/.bin/opencode"
