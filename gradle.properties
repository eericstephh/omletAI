org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# 2026-10-20 — give the Kotlin compile daemon its OWN explicit heap.
#
# Without this the Kotlin plugin derives the daemon's Xmx from whatever
# the Gradle daemon happens to have left, so on a busy machine (the
# IDE, a browser and the NDK build all running at once) the compiler
# daemon started with a heap too small for the release build and died
# with "java.lang.OutOfMemoryError: GC overhead limit exceeded" —
# intermittently, and only when several heavy tasks ran together
# (e.g. `testDebugUnitTest assembleDebug compileReleaseKotlin`).
#
# A fixed size makes the compiler's memory need predictable instead of
# a race against whatever else is running. 3 GB is enough for this
# project's largest module (the editor screen) with room to spare.
kotlin.daemon.jvmargs=-Xmx3072m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Pin Gradle's launcher JVM to the locally installed JetBrains
# Runtime 21.0.11. The host's default `java` resolves to
# Microsoft OpenJDK 25.0.4.1, which uses class file version 69
# and is rejected by the Gradle 8.13 wrapper's embedded
# Kotlin DSL compiler (CliJavaModuleFinder → JavaVersion.parse).
# JDK 21 has full compatibility with Kotlin 2.0.21 and AGP 8.13.2.
# This setting affects only the Gradle daemon — it does not change
# the application's compileSdk, targetSdk, or any plugin version.
org.gradle.java.home=C:/Users/eric steph/.jdks/jbr-21.0.11
